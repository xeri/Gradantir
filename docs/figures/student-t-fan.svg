<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="ui-monospace, 'IBM Plex Mono', monospace">
  <rect width="900" height="320" fill="#0A0D12"/>
  <text x="24" y="34" fill="#E8A33D" font-size="13" font-weight="700" letter-spacing="3">STUDENT-T FAN — INTERVALS THAT ADMIT HOW LITTLE THEY KNOW</text>

  <!-- shared: y maps score 40..110 to y 270..60 (3px per pt) -->

  <!-- LEFT PANEL: n=2, df 5 -->
  <text x="60" y="64" fill="#DFE5EC" font-size="12" font-weight="700">n = 2 (df 5)</text>
  <line x1="60" y1="90" x2="400" y2="90" stroke="#5C6779" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="404" y="94" fill="#5C6779" font-size="10">100 — TRUNCATED</text>
  <line x1="60" y1="270" x2="400" y2="270" stroke="#1F2733" stroke-width="1"/>
  <!-- 90% band: mean 88, ±20 -> 68..108, clipped at 100 -->
  <polygon points="180,126 340,90 340,186" fill="#53B1FD" fill-opacity="0.10"/>
  <!-- 50% band: ±8 -> 80..96 -->
  <polygon points="180,126 340,102 340,150" fill="#53B1FD" fill-opacity="0.22"/>
  <!-- mean line -->
  <line x1="180" y1="126" x2="340" y2="126" stroke="#53B1FD" stroke-width="1.8" stroke-dasharray="6 4"/>
  <circle cx="340" cy="126" r="3.5" fill="#53B1FD"/>
  <!-- prints -->
  <circle cx="120" cy="138" r="4.5" fill="#E8A33D"/>
  <circle cx="180" cy="126" r="4.5" fill="#E8A33D"/>
  <text x="352" y="130" fill="#53B1FD" font-size="11" font-weight="700">88</text>
  <text x="352" y="106" fill="#5C6779" font-size="10">50%</text>
  <text x="352" y="184" fill="#5C6779" font-size="10">90%</text>
  <text x="60" y="292" fill="#5C6779" font-size="10">TWO PRINTS: WIDE, FAT-TAILED, AND CLIPPED AT THE CEILING</text>

  <!-- RIGHT PANEL: n=10, df 13 -->
  <text x="500" y="64" fill="#DFE5EC" font-size="12" font-weight="700">n = 10 (df 13)</text>
  <line x1="500" y1="90" x2="840" y2="90" stroke="#5C6779" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="500" y1="270" x2="840" y2="270" stroke="#1F2733" stroke-width="1"/>
  <!-- 90% band: mean 74, ±9 -> 65..83 : y 168±27 -->
  <polygon points="720,168 780,141 780,195" fill="#53B1FD" fill-opacity="0.10"/>
  <!-- 50% band: ±4 -> y 168±12 -->
  <polygon points="720,168 780,156 780,180" fill="#53B1FD" fill-opacity="0.22"/>
  <line x1="720" y1="168" x2="780" y2="168" stroke="#53B1FD" stroke-width="1.8" stroke-dasharray="6 4"/>
  <circle cx="780" cy="168" r="3.5" fill="#53B1FD"/>
  <!-- prints: wobbling around 72-77 -->
  <circle cx="520" cy="186" r="4" fill="#E8A33D"/>
  <circle cx="542" cy="174" r="4" fill="#E8A33D"/>
  <circle cx="564" cy="180" r="4" fill="#E8A33D"/>
  <circle cx="586" cy="165" r="4" fill="#E8A33D"/>
  <circle cx="608" cy="177" r="4" fill="#E8A33D"/>
  <circle cx="630" cy="162" r="4" fill="#E8A33D"/>
  <circle cx="652" cy="171" r="4" fill="#E8A33D"/>
  <circle cx="674" cy="159" r="4" fill="#E8A33D"/>
  <circle cx="696" cy="171" r="4" fill="#E8A33D"/>
  <circle cx="720" cy="168" r="4" fill="#E8A33D"/>
  <text x="790" y="172" fill="#53B1FD" font-size="11" font-weight="700">74</text>
  <text x="790" y="148" fill="#5C6779" font-size="10">90%</text>
  <text x="500" y="292" fill="#5C6779" font-size="10">TEN PRINTS: THE SAME MACHINERY, EARNED CONFIDENCE</text>

  <text x="24" y="312" fill="#5C6779" font-size="10" letter-spacing="1">PREDICTIVE t HAS df = 2&#945; — LOW df MEANS HEAVY TAILS: SMALL SAMPLES CANNOT BUY GAUSSIAN CERTAINTY</text>
</svg>
