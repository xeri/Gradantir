<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="ui-monospace, 'IBM Plex Mono', monospace">
  <rect width="900" height="280" fill="#0A0D12"/>
  <text x="24" y="34" fill="#E8A33D" font-size="13" font-weight="700" letter-spacing="3">EMPIRICAL-BAYES SHRINKAGE — THIN DESKS BORROW STRENGTH</text>

  <!-- axis -->
  <line x1="80" y1="210" x2="820" y2="210" stroke="#2C3748" stroke-width="1.5"/>
  <g fill="#5C6779" font-size="10" text-anchor="middle">
    <line x1="203" y1="210" x2="203" y2="216" stroke="#2C3748"/><text x="203" y="230">50</text>
    <line x1="327" y1="210" x2="327" y2="216" stroke="#2C3748"/><text x="327" y="230">60</text>
    <line x1="450" y1="210" x2="450" y2="216" stroke="#2C3748"/><text x="450" y="230">70</text>
    <line x1="573" y1="210" x2="573" y2="216" stroke="#2C3748"/><text x="573" y="230">80</text>
    <line x1="697" y1="210" x2="697" y2="216" stroke="#2C3748"/><text x="697" y="230">90</text>
    <line x1="820" y1="210" x2="820" y2="216" stroke="#2C3748"/><text x="820" y="230">100</text>
  </g>

  <!-- grand mean -->
  <line x1="500" y1="52" x2="500" y2="210" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="500" y="46" fill="#E8A33D" font-size="11" font-weight="700" text-anchor="middle">GRAND MEAN 74.0</text>

  <!-- GEO: n=2, big shrink -->
  <line x1="689" y1="80" x2="597" y2="80" stroke="#2596B8" stroke-width="1.5"/>
  <polygon points="597,80 606,75.5 606,84.5" fill="#2596B8"/>
  <circle cx="697" cy="80" r="5" fill="#2596B8"/>
  <circle cx="589" cy="80" r="5" fill="none" stroke="#2596B8" stroke-width="1.5"/>
  <text x="710" y="84" fill="#2596B8" font-size="11" font-weight="700">GEO  n=2  B=.45</text>

  <!-- ENG: n=6, small shrink -->
  <line x1="565" y1="125" x2="561" y2="125" stroke="#E0662E" stroke-width="1.5"/>
  <polygon points="558,125 566,120.5 566,129.5" fill="#E0662E"/>
  <circle cx="573" cy="125" r="5" fill="#E0662E"/>
  <circle cx="555" cy="125" r="5" fill="none" stroke="#E0662E" stroke-width="1.5"/>
  <text x="586" y="129" fill="#E0662E" font-size="11" font-weight="700">ENG  n=6  B=.75</text>

  <!-- MATH: n=14, tiny shrink (pulled right toward grand) -->
  <line x1="407" y1="170" x2="407" y2="170" stroke="#4D7CFE" stroke-width="1.5"/>
  <polygon points="412,170 404,165.5 404,174.5" fill="#4D7CFE"/>
  <circle cx="401" cy="170" r="5" fill="#4D7CFE"/>
  <circle cx="413" cy="170" r="5" fill="none" stroke="#4D7CFE" stroke-width="1.5"/>
  <text x="290" y="174" fill="#4D7CFE" font-size="11" font-weight="700" text-anchor="end">MATH  n=14  B=.87</text>

  <g fill="#5C6779" font-size="10">
    <text x="80" y="256">&#9679; RAW SUBJECT MEAN&#160;&#160;&#160;&#9675; SHRUNK ESTIMATE&#160;&#160;&#160;ARROW LENGTH &#8733; (1&#8722;B)</text>
    <text x="80" y="272">B = &#964;&#178; / (&#964;&#178; + &#963;&#178;/n) — ONE HOT PRINT ON A NEW DESK IS MOSTLY THE BOOK TALKING</text>
  </g>
</svg>
